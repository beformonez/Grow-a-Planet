<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Burger Rush 🍔 — Idle Diner Prototype</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    width: 100%; height: 100%;
    background: #2b1a12;
    font-family: 'Segoe UI', 'Trebuchet MS', Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: fixed; top: 0; left: 0; width: 100%;
    pointer-events: none; z-index: 10;
  }
  #cashBar {
    position: absolute; top: 14px; left: 14px;
    background: linear-gradient(180deg,#3a8f3a,#2c6e2c);
    border: 3px solid #1f4d1f;
    border-radius: 14px;
    padding: 8px 18px;
    color: #fff; font-weight: 700; font-size: 22px;
    box-shadow: 0 4px 0 rgba(0,0,0,0.25);
  }
  #cashBar span { color: #d7ffb0; }
  #title {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    color: #ffe3b0; font-size: 20px; font-weight: 800; letter-spacing: 1px;
    text-shadow: 0 2px 0 #7a3d0f, 0 0 10px rgba(0,0,0,0.4);
  }
  #stats {
    position: absolute; top: 14px; right: 14px;
    background: rgba(30,18,12,0.75);
    border: 2px solid #6b3d1a;
    border-radius: 12px;
    padding: 6px 12px;
    color: #ffe3b0; font-size: 13px; line-height: 1.5em;
    text-align: right;
  }
  #toast {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 15px; font-weight: 600;
    background: rgba(0,0,0,0.55); padding: 6px 14px; border-radius: 10px;
    opacity: 0; transition: opacity 0.4s;
  }
  #toast.show { opacity: 1; }

  #joystickBase {
    position: fixed; bottom: 36px; left: 36px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 3px solid rgba(255,255,255,0.35);
    z-index: 20; touch-action: none;
  }
  #joystickKnob {
    position: absolute; top: 50%; left: 50%;
    width: 54px; height: 54px; border-radius: 50%;
    background: rgba(255,204,102,0.9);
    border: 3px solid #b5620a;
    transform: translate(-50%, -50%);
  }
  #controlsHint {
    position: fixed; bottom: 40px; right: 20px;
    color: #ffe3b0; font-size: 12px; text-align: right;
    background: rgba(0,0,0,0.35); padding: 8px 12px; border-radius: 10px;
    z-index: 15; max-width: 200px;
  }
  @media (max-width: 700px) {
    #controlsHint { display: none; }
  }
</style>
</head>
<body>

<div id="hud">
  <div id="title">🍔 BURGER RUSH</div>
  <div id="cashBar">$<span id="cashVal">0</span></div>
  <div id="stats" id="statsBox">
    Tables: <span id="tableCount">0/0</span><br>
    Staff: <span id="workerCount">0</span>
  </div>
  <div id="toast"></div>
</div>

<div id="joystickBase">
  <div id="joystickKnob"></div>
</div>

<div id="controlsHint">
  WASD / Arrow keys to move<br>
  Stand at the grill to load burgers<br>
  Walk to seated guests to serve<br>
  Walk over glowing pads to unlock
</div>

<canvas id="gameCanvas"></canvas>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from "three";

/* =========================================================================
   BURGER RUSH — single file three.js prototype
   Low-poly hyper-casual idle diner game
   ========================================================================= */

/* ---------------------------- Global state ---------------------------- */
const state = {
  cash: 20,
  workers: 0,
  maxWorkers: 3,
  clock: new THREE.Clock(),
  keys: {},
  joystick: { active: false, x: 0, y: 0 },
  playerCarrying: 0,
  maxCarry: 10,
  grillTimer: 0,
  serveTimer: 0,
  spawnTimer: 0,
  spawnInterval: 5.5,
  nextParticleId: 0,
};

const FLOOR_HALF_X = 7.2;
const FLOOR_MIN_Z = -4.6;
const FLOOR_MAX_Z = 5.0;
const GRILL_POS = new THREE.Vector3(0, 0, -4.0);
const DOOR_POS = new THREE.Vector3(0, 0, 5.4);

/* ------------------------------ Renderer ------------------------------ */
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x1c1410);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a1710);
scene.fog = new THREE.Fog(0x2a1710, 22, 40);

/* ------------------------------- Camera -------------------------------- */
const VIEW_SIZE = 11;
let camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
function setCameraFrustum() {
  const aspect = window.innerWidth / window.innerHeight;
  camera.left = -VIEW_SIZE * aspect;
  camera.right = VIEW_SIZE * aspect;
  camera.top = VIEW_SIZE;
  camera.bottom = -VIEW_SIZE;
  camera.updateProjectionMatrix();
}
setCameraFrustum();
camera.position.set(15, 17, 15);
camera.lookAt(0, 0, 0.4);

/* ------------------------------ Lighting -------------------------------- */
const ambient = new THREE.AmbientLight(0xfff2df, 0.75);
scene.add(ambient);

const sun = new THREE.DirectionalLight(0xffe3b0, 1.15);
sun.position.set(10, 18, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -18;
sun.shadow.camera.right = 18;
sun.shadow.camera.top = 18;
sun.shadow.camera.bottom = -18;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 50;
sun.shadow.bias = -0.0015;
scene.add(sun);

const fillLight = new THREE.DirectionalLight(0xffb37a, 0.3);
fillLight.position.set(-8, 6, -6);
scene.add(fillLight);

/* --------------------------- Helper builders ---------------------------- */

function makeCanvasTexture(draw, w = 256, h = 256) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

function makeSprite(text, opts = {}) {
  const {
    fontSize = 64, bg = 'rgba(0,0,0,0)', color = '#222',
    padding = 10, scale = 1.0, bold = true, stroke = null
  } = opts;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `${bold ? '800' : '400'} ${fontSize}px sans-serif`;
  const metrics = ctx.measureText(text);
  c.width = Math.ceil(metrics.width) + padding * 2;
  c.height = fontSize + padding * 2;
  ctx.font = `${bold ? '800' : '400'} ${fontSize}px sans-serif`;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, c.width, c.height);
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  if (stroke) {
    ctx.lineWidth = 6;
    ctx.strokeStyle = stroke;
    ctx.strokeText(text, c.width / 2, c.height / 2 + 2);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, c.width / 2, c.height / 2 + 2);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(mat);
  const ratio = c.width / c.height;
  sprite.scale.set(ratio * scale, scale, 1);
  return sprite;
}

/* ---------------------------------- Floor -------------------------------- */
function buildFloor() {
  const tex = makeCanvasTexture((ctx, w, h) => {
    const tiles = 8;
    const s = w / tiles;
    for (let y = 0; y < tiles; y++) {
      for (let x = 0; x < tiles; x++) {
        ctx.fillStyle = (x + y) % 2 === 0 ? '#d9c9a3' : '#b98f5a';
        ctx.fillRect(x * s, y * s, s, s);
      }
    }
  }, 512, 512);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4.2, 3);

  const floorGeo = new THREE.PlaneGeometry(FLOOR_HALF_X * 2 + 1.5, FLOOR_MAX_Z - FLOOR_MIN_Z + 2);
  const floorMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.9 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0, (FLOOR_MAX_Z + FLOOR_MIN_Z) / 2);
  floor.receiveShadow = true;
  scene.add(floor);

  // back wall
  const wallMat = new THREE.MeshStandardMaterial({ color: 0x8a4a2c });
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(FLOOR_HALF_X * 2 + 1.5, 3.2, 0.4), wallMat);
  backWall.position.set(0, 1.6, FLOOR_MIN_Z - 0.9);
  backWall.receiveShadow = true;
  backWall.castShadow = true;
  scene.add(backWall);

  const sideMat = new THREE.MeshStandardMaterial({ color: 0x7a3e22 });
  const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.4, 3.2, FLOOR_MAX_Z - FLOOR_MIN_Z + 2), sideMat);
  wallL.position.set(-FLOOR_HALF_X - 1.0, 1.6, (FLOOR_MAX_Z + FLOOR_MIN_Z) / 2);
  scene.add(wallL);
  const wallR = wallL.clone();
  wallR.position.x = FLOOR_HALF_X + 1.0;
  scene.add(wallR);
}
buildFloor();

/* ------------------------------- Grill counter ---------------------------- */
function buildGrillCounter() {
  const group = new THREE.Group();
  const baseMat = new THREE.MeshStandardMaterial({ color: 0xc0392b });
  const topMat = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, metalness: 0.4, roughness: 0.5 });

  const base = new THREE.Mesh(new THREE.BoxGeometry(5.2, 1.1, 1.4), baseMat);
  base.position.set(0, 0.55, -4.3);
  base.castShadow = true; base.receiveShadow = true;
  group.add(base);

  const top = new THREE.Mesh(new THREE.BoxGeometry(5.4, 0.12, 1.6), topMat);
  top.position.set(0, 1.16, -4.3);
  top.castShadow = true;
  group.add(top);

  // grill plate glow patch
  const plate = new THREE.Mesh(new THREE.CircleGeometry(0.55, 24),
    new THREE.MeshStandardMaterial({ color: 0x5b3a29, emissive: 0x552200, emissiveIntensity: 0.4 }));
  plate.rotation.x = -Math.PI / 2;
  plate.position.set(0, 1.23, -4.3);
  group.add(plate);

  // little sign
  const sign = makeSprite('GRILL', { fontSize: 60, color: '#fff', bg: 'rgba(200,30,30,0.85)', scale: 1.1, stroke: '#7a1c10' });
  sign.position.set(0, 2.1, -4.3);
  group.add(sign);

  scene.add(group);
  return { position: new THREE.Vector3(0, 0, -4.3), radius: 2.3 };
}
const grillZone = buildGrillCounter();

/* --------------------------------- Burger mesh ---------------------------- */
function createBurger(scale = 1) {
  const g = new THREE.Group();
  const bunBottom = new THREE.Mesh(
    new THREE.CylinderGeometry(0.32, 0.34, 0.14, 14),
    new THREE.MeshStandardMaterial({ color: 0xd8a054 })
  );
  bunBottom.position.y = 0.07;
  const patty = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3, 0.3, 0.1, 14),
    new THREE.MeshStandardMaterial({ color: 0x6b3a26 })
  );
  patty.position.y = 0.19;
  const cheese = new THREE.Mesh(
    new THREE.BoxGeometry(0.46, 0.04, 0.46),
    new THREE.MeshStandardMaterial({ color: 0xf2c53d })
  );
  cheese.rotation.y = Math.PI / 4;
  cheese.position.y = 0.26;
  const lettuce = new THREE.Mesh(
    new THREE.CylinderGeometry(0.34, 0.34, 0.06, 14),
    new THREE.MeshStandardMaterial({ color: 0x5aa63c })
  );
  lettuce.position.y = 0.31;
  const bunTop = new THREE.Mesh(
    new THREE.SphereGeometry(0.32, 14, 10, 0, Math.PI * 2, 0, Math.PI / 1.7),
    new THREE.MeshStandardMaterial({ color: 0xe8ad5c })
  );
  bunTop.position.y = 0.36;
  [bunBottom, patty, cheese, lettuce, bunTop].forEach(m => { m.castShadow = true; g.add(m); });
  g.scale.setScalar(scale);
  return g;
}

/* -------------------------------- Characters ------------------------------ */
function createCharacter({ shirt = 0xffffff, apron = null, cap = null, skin = 0xffcfa0, hair = 0x3a2a1c, scale = 1 } = {}) {
  const group = new THREE.Group();

  const legMat = new THREE.MeshStandardMaterial({ color: 0x2b2b2b });
  const legGeo = new THREE.CylinderGeometry(0.13, 0.13, 0.5, 8);
  const legL = new THREE.Mesh(legGeo, legMat); legL.position.set(-0.16, 0.25, 0); legL.castShadow = true;
  const legR = legL.clone(); legR.position.x = 0.16;
  group.add(legL, legR);

  const bodyMat = new THREE.MeshStandardMaterial({ color: shirt });
  const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.36, 0.42, 4, 8), bodyMat);
  body.position.y = 1.08;
  body.castShadow = true;
  group.add(body);

  if (apron !== null) {
    const apronMesh = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.62, 0.06),
      new THREE.MeshStandardMaterial({ color: apron })
    );
    apronMesh.position.set(0, 0.95, 0.33);
    group.add(apronMesh);
  }

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.29, 14, 12), new THREE.MeshStandardMaterial({ color: skin }));
  head.position.y = 1.82;
  head.castShadow = true;
  group.add(head);

  if (cap !== null) {
    const capMesh = new THREE.Mesh(
      new THREE.CylinderGeometry(0.31, 0.33, 0.2, 14),
      new THREE.MeshStandardMaterial({ color: cap })
    );
    capMesh.position.y = 2.05;
    group.add(capMesh);
    const brim = new THREE.Mesh(
      new THREE.CylinderGeometry(0.36, 0.36, 0.05, 14),
      new THREE.MeshStandardMaterial({ color: cap })
    );
    brim.position.set(0, 1.97, 0.12);
    group.add(brim);
  } else {
    const hairMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 12, 10, 0, Math.PI * 2, 0, Math.PI / 2), new THREE.MeshStandardMaterial({ color: hair }));
    hairMesh.position.y = 1.9;
    group.add(hairMesh);
  }

  group.scale.setScalar(scale);
  group.userData.legL = legL;
  group.userData.legR = legR;
  group.userData.walkPhase = Math.random() * 10;
  return group;
}

/* ----------------------------------- Player -------------------------------- */
const player = createCharacter({ shirt: 0xffffff, apron: 0xd8442a, cap: 0xd8442a });
player.position.set(0, 0, 2.5);
scene.add(player);

// tray group for carried burgers, attached above player's head
const trayGroup = new THREE.Group();
trayGroup.position.set(0, 2.15, 0);
player.add(trayGroup);
let trayBurgers = [];

function updateTrayVisual(count) {
  while (trayBurgers.length < count) {
    const b = createBurger(0.55);
    b.position.y = trayBurgers.length * 0.19;
    trayGroup.add(b);
    trayBurgers.push(b);
  }
  while (trayBurgers.length > count) {
    const b = trayBurgers.pop();
    trayGroup.remove(b);
  }
}

/* -------------------------------- Tables ----------------------------------- */
const TABLE_SLOTS = [
  { x: -4.3, z: -1.0, cost: 0 },
  { x: 0.0, z: -1.0, cost: 0 },
  { x: 4.3, z: -1.0, cost: 15 },
  { x: -4.3, z: 2.3, cost: 30 },
  { x: 0.0, z: 2.3, cost: 45 },
  { x: 4.3, z: 2.3, cost: 60 },
];

const tables = [];
const unlockZones = [];

function createChair(x, z, rotY) {
  const mat = new THREE.MeshStandardMaterial({ color: 0x6b4226 });
  const g = new THREE.Group();
  const seat = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.08, 0.5), mat);
  seat.position.y = 0.5;
  const back = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.08), mat);
  back.position.set(0, 0.75, -0.24);
  const legGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 6);
  [[-0.2, 0.25, -0.2], [0.2, 0.25, -0.2], [-0.2, 0.25, 0.2], [0.2, 0.25, 0.2]].forEach(p => {
    const leg = new THREE.Mesh(legGeo, mat);
    leg.position.set(...p);
    g.add(leg);
  });
  g.add(seat, back);
  g.position.set(x, 0, z);
  g.rotation.y = rotY;
  g.traverse(m => { if (m.isMesh) { m.castShadow = true; m.receiveShadow = true; } });
  return g;
}

function buildTableMesh() {
  const g = new THREE.Group();
  const topMat = new THREE.MeshStandardMaterial({ color: 0xdec9a3 });
  const legMat = new THREE.MeshStandardMaterial({ color: 0x8a5a34 });
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.12, 20), topMat);
  top.position.y = 0.75;
  top.castShadow = true; top.receiveShadow = true;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 0.7, 10), legMat);
  pole.position.y = 0.4;
  pole.castShadow = true;
  g.add(top, pole);
  g.add(createChair(0, -0.95, 0));
  g.add(createChair(0, 0.95, Math.PI));
  g.add(createChair(-0.95, 0, Math.PI / 2));
  g.add(createChair(0.95, 0, -Math.PI / 2));
  return g;
}

function createUnlockPad(pos, cost, label) {
  const g = new THREE.Group();
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.75, 0.95, 24),
    new THREE.MeshStandardMaterial({ color: 0xffd76a, emissive: 0xffb700, emissiveIntensity: 0.6, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.02;
  const fill = new THREE.Mesh(
    new THREE.CircleGeometry(0.73, 24),
    new THREE.MeshStandardMaterial({ color: 0x2fbf4f, transparent: true, opacity: 0.35 })
  );
  fill.rotation.x = -Math.PI / 2;
  fill.position.y = 0.015;
  fill.scale.set(0.001, 0.001, 0.001);
  g.add(ring, fill);
  const text = makeSprite(`$${cost}`, { fontSize: 56, color: '#ffe98a', bg: 'rgba(30,20,10,0.7)', scale: 0.9, stroke: '#000' });
  text.position.set(0, 1.7, 0);
  g.add(text);
  const subtitle = makeSprite(label, { fontSize: 34, color: '#fff', bg: 'rgba(30,20,10,0.55)', scale: 0.5 });
  subtitle.position.set(0, 1.3, 0);
  g.add(subtitle);
  g.position.copy(pos);
  scene.add(g);
  return { group: g, fill, cost, progress: 0, position: pos.clone(), radius: 1.3, done: false };
}

TABLE_SLOTS.forEach((slot, i) => {
  const pos = new THREE.Vector3(slot.x, 0, slot.z);
  const unlocked = slot.cost === 0;
  const tableGroup = buildTableMesh();
  tableGroup.position.copy(pos);
  tableGroup.scale.setScalar(unlocked ? 1 : 0.001);
  tableGroup.visible = unlocked;
  scene.add(tableGroup);

  const table = {
    mesh: tableGroup,
    position: pos,
    seatOffset: new THREE.Vector3(0, 0, 1.3),
    unlocked,
    occupied: false,
    customer: null,
    index: i,
  };
  tables.push(table);

  if (!unlocked) {
    const zone = createUnlockPad(pos, slot.cost, 'Unlock Table');
    zone.type = 'table';
    zone.tableIndex = i;
    unlockZones.push(zone);
  }
});

/* -------------------------------- Hire worker pad --------------------------- */
const HIRE_BASE_COST = 30;
let workerPad = null;
function spawnWorkerPad() {
  const cost = HIRE_BASE_COST + state.workers * 30;
  const pos = new THREE.Vector3(-3.0, 0, -3.6);
  workerPad = createUnlockPad(pos, cost, 'Hire Worker');
  workerPad.type = 'worker';
  unlockZones.push(workerPad);
}
spawnWorkerPad();

/* ----------------------------------- Workers -------------------------------- */
const workers = [];
function hireWorker() {
  const w = createCharacter({ shirt: 0xbfe0ff, apron: 0x1c4f7a, cap: 0x1c4f7a });
  w.position.set(-3 + Math.random() * 1.5, 0, -3.0);
  scene.add(w);
  const trayG = new THREE.Group();
  trayG.position.set(0, 2.15, 0);
  w.add(trayG);
  workers.push({
    group: w,
    tray: trayG,
    trayMeshes: [],
    carrying: 0,
    state: 'toGrill',
    target: null,
    grillTimer: 0,
    serveTimer: 0,
    speed: 2.6,
  });
  state.workers++;
  document.getElementById('workerCount').textContent = state.workers;
}

function updateWorkerTray(w) {
  while (w.trayMeshes.length < w.carrying) {
    const b = createBurger(0.5);
    b.position.y = w.trayMeshes.length * 0.18;
    w.tray.add(b);
    w.trayMeshes.push(b);
  }
  while (w.trayMeshes.length > w.carrying) {
    const b = w.trayMeshes.pop();
    w.tray.remove(b);
  }
}

/* --------------------------------- Customers -------------------------------- */
const customers = [];
const cashPickups = [];
const particles = [];

const SKIN_TONES = [0xffcfa0, 0xe8b07a, 0xc98a56, 0x8a5a34, 0xf0dcc0];
const SHIRT_COLORS = [0x4a90d9, 0xd94a4a, 0x7ac96e, 0xf2c53d, 0x9b59b6, 0xe67e22, 0x1abc9c];

function findFreeTable() {
  const free = tables.filter(t => t.unlocked && !t.occupied);
  if (free.length === 0) return null;
  return free[Math.floor(Math.random() * free.length)];
}

function spawnCustomer() {
  const table = findFreeTable();
  if (!table) return;
  table.occupied = true;

  const cust = createCharacter({
    shirt: SHIRT_COLORS[Math.floor(Math.random() * SHIRT_COLORS.length)],
    skin: SKIN_TONES[Math.floor(Math.random() * SKIN_TONES.length)],
    cap: null,
  });
  cust.position.copy(DOOR_POS);
  scene.add(cust);

  const bubble = makeSprite('🍔', { fontSize: 70, bg: 'rgba(255,255,255,0.9)', scale: 0.8 });
  bubble.position.set(0, 2.5, 0);
  cust.add(bubble);
  bubble.visible = false;

  const needed = 1 + Math.floor(Math.random() * 3);
  const needText = makeSprite(`x${needed}`, { fontSize: 40, color: '#c0392b', bg: 'rgba(255,255,255,0.0)', scale: 0.5 });
  needText.position.set(0.5, 2.55, 0);
  cust.add(needText);
  needText.visible = false;

  const seatPos = table.position.clone().add(table.seatOffset);

  customers.push({
    group: cust,
    bubble,
    needText,
    table,
    needed,
    served: 0,
    state: 'walkingIn',
    target: seatPos,
    patience: 26,
    eatTimer: 0,
    speed: 2.2,
  });
}

function spawnCashPickup(pos) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color: 0x3fbf4f });
  for (let i = 0; i < 3; i++) {
    const bill = new THREE.Mesh(new THREE.BoxGeometry(0.36, 0.05, 0.24), mat);
    bill.position.y = 0.15 + i * 0.06;
    bill.rotation.y = Math.random() * 0.4 - 0.2;
    bill.castShadow = true;
    g.add(bill);
  }
  g.position.copy(pos);
  g.position.y = 0;
  scene.add(g);
  cashPickups.push({ group: g, value: 8 + Math.floor(Math.random() * 8), life: 0 });
}

function spawnParticleBurst(pos, color = 0xffe066, count = 8) {
  for (let i = 0; i < count; i++) {
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.06, 6, 6),
      new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6, transparent: true })
    );
    mesh.position.copy(pos);
    mesh.position.y += 1.6;
    scene.add(mesh);
    particles.push({
      mesh,
      vel: new THREE.Vector3((Math.random() - 0.5) * 1.6, Math.random() * 2.2 + 1.2, (Math.random() - 0.5) * 1.6),
      life: 1.0,
    });
  }
}

/* --------------------------------- Toast helper ------------------------------ */
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ------------------------------------ Input ----------------------------------- */
window.addEventListener('keydown', e => { state.keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { state.keys[e.key.toLowerCase()] = false; });

const joyBase = document.getElementById('joystickBase');
const joyKnob = document.getElementById('joystickKnob');
let joyTouchId = null;
const JOY_RADIUS = 45;

function joyStart(x, y, id) {
  joyTouchId = id;
  state.joystick.active = true;
  updateJoy(x, y);
}
function updateJoy(x, y) {
  const rect = joyBase.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = x - cx, dy = y - cy;
  const dist = Math.min(Math.hypot(dx, dy), JOY_RADIUS);
  const angle = Math.atan2(dy, dx);
  dx = Math.cos(angle) * dist;
  dy = Math.sin(angle) * dist;
  joyKnob.style.transform = `translate(${dx - 27 + 27}px, ${dy - 27 + 27}px) translate(-50%,-50%)`;
  joyKnob.style.left = `${27 + dx}px`;
  joyKnob.style.top = `${27 + dy}px`;
  state.joystick.x = dx / JOY_RADIUS;
  state.joystick.y = dy / JOY_RADIUS;
}
function joyEnd() {
  joyTouchId = null;
  state.joystick.active = false;
  state.joystick.x = 0; state.joystick.y = 0;
  joyKnob.style.left = '50%'; joyKnob.style.top = '50%';
  joyKnob.style.transform = 'translate(-50%,-50%)';
}
joyBase.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joyStart(t.clientX, t.clientY, t.identifier);
}, { passive: false });
joyBase.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) updateJoy(t.clientX, t.clientY);
  }
}, { passive: false });
window.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) joyEnd();
  }
});
// mouse fallback for desktop testing of the joystick
let mouseDown = false;
joyBase.addEventListener('mousedown', e => { mouseDown = true; joyStart(e.clientX, e.clientY, 'mouse'); });
window.addEventListener('mousemove', e => { if (mouseDown) updateJoy(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false; joyEnd(); } });

/* ------------------------------------ Update: Player --------------------------- */
let playerFacing = 0;

function updatePlayer(delta) {
  let mx = 0, mz = 0;
  if (state.keys['w'] || state.keys['arrowup']) mz -= 1;
  if (state.keys['s'] || state.keys['arrowdown']) mz += 1;
  if (state.keys['a'] || state.keys['arrowleft']) mx -= 1;
  if (state.keys['d'] || state.keys['arrowright']) mx += 1;

  mx += state.joystick.x;
  mz += state.joystick.y;

  const len = Math.hypot(mx, mz);
  const moving = len > 0.05;
  if (moving) {
    mx /= len; mz /= len;
    const speed = 4.2;
    player.position.x += mx * speed * delta;
    player.position.z += mz * speed * delta;
    player.position.x = THREE.MathUtils.clamp(player.position.x, -FLOOR_HALF_X + 0.5, FLOOR_HALF_X - 0.5);
    player.position.z = THREE.MathUtils.clamp(player.position.z, FLOOR_MIN_Z + 0.5, FLOOR_MAX_Z + 0.3);

    const targetAngle = Math.atan2(mx, mz);
    playerFacing = THREE.MathUtils.lerp(playerFacing, targetAngle, 0.25);
    player.rotation.y = playerFacing;

    const t = performance.now() * 0.012;
    player.userData.legL.rotation.x = Math.sin(t) * 0.6;
    player.userData.legR.rotation.x = -Math.sin(t) * 0.6;
  } else {
    player.userData.legL.rotation.x = THREE.MathUtils.lerp(player.userData.legL.rotation.x, 0, 0.2);
    player.userData.legR.rotation.x = THREE.MathUtils.lerp(player.userData.legR.rotation.x, 0, 0.2);
  }
}

/* ------------------------------------ Update: Grill ----------------------------- */
function updatePlayerGrill(delta) {
  const dist = player.position.distanceTo(grillZone.position);
  if (dist < grillZone.radius && state.playerCarrying < state.maxCarry) {
    state.grillTimer += delta;
    if (state.grillTimer >= 0.45) {
      state.grillTimer = 0;
      state.playerCarrying = Math.min(state.maxCarry, state.playerCarrying + 1);
      updateTrayVisual(state.playerCarrying);
    }
  } else {
    state.grillTimer = 0;
  }
}

/* ------------------------------------ Update: Serving ---------------------------- */
function updatePlayerServing(delta) {
  if (state.playerCarrying <= 0) { state.serveTimer = 0; return; }
  let servedThisFrame = false;
  for (const cust of customers) {
    if (cust.state !== 'seated') continue;
    if (cust.served >= cust.needed) continue;
    const dist = player.position.distanceTo(cust.table.position);
    if (dist < 2.1) {
      state.serveTimer += delta;
      if (state.serveTimer >= 0.35) {
        state.serveTimer = 0;
        state.playerCarrying--;
        cust.served++;
        updateTrayVisual(state.playerCarrying);
        if (cust.served >= cust.needed) {
          cust.state = 'eating';
          cust.eatTimer = 0;
          cust.bubble.visible = false;
          cust.needText.visible = false;
        }
      }
      servedThisFrame = true;
      break;
    }
  }
  if (!servedThisFrame) state.serveTimer = 0;
}

/* ------------------------------------ Update: Customers --------------------------- */
function updateCustomers(delta) {
  for (let i = customers.length - 1; i >= 0; i--) {
    const c = customers[i];
    const g = c.group;

    if (c.state === 'walkingIn' || c.state === 'walkingOut') {
      const dir = new THREE.Vector3().subVectors(c.target, g.position);
      dir.y = 0;
      const dist = dir.length();
      if (dist > 0.15) {
        dir.normalize();
        g.position.x += dir.x * c.speed * delta;
        g.position.z += dir.z * c.speed * delta;
        const angle = Math.atan2(dir.x, dir.z);
        g.rotation.y = THREE.MathUtils.lerp(g.rotation.y, angle, 0.2);
        const t = performance.now() * 0.012 + g.userData.walkPhase;
        g.userData.legL.rotation.x = Math.sin(t) * 0.6;
        g.userData.legR.rotation.x = -Math.sin(t) * 0.6;
      } else {
        if (c.state === 'walkingIn') {
          c.state = 'seated';
          g.rotation.y = Math.PI;
          c.bubble.visible = true;
          c.needText.visible = true;
        } else {
          scene.remove(g);
          customers.splice(i, 1);
        }
      }
      continue;
    }

    if (c.state === 'seated') {
      c.patience -= delta;
      if (c.patience <= 0) {
        // customer leaves unhappy, frees table, no cash
        c.table.occupied = false;
        c.bubble.visible = false;
        c.needText.visible = false;
        c.state = 'walkingOut';
        c.target = DOOR_POS.clone();
      }
      continue;
    }

    if (c.state === 'eating') {
      c.eatTimer += delta;
      if (c.eatTimer > 1.6 && c.eatTimer < 1.7) {
        spawnParticleBurst(g.position, 0xffe066, 6);
      }
      if (c.eatTimer >= 2.0) {
        spawnCashPickup(c.table.position.clone().add(new THREE.Vector3(0.9, 0, 0.9)));
        c.table.occupied = false;
        c.state = 'walkingOut';
        c.target = DOOR_POS.clone();
      }
    }
  }
}

/* ------------------------------------ Update: Workers ------------------------------ */
function updateWorkers(delta) {
  for (const w of workers) {
    const g = w.group;

    if (w.state === 'toGrill') {
      const dir = new THREE.Vector3().subVectors(grillZone.position, g.position);
      dir.y = 0;
      const dist = dir.length();
      if (dist > 1.6) {
        dir.normalize();
        g.position.x += dir.x * w.speed * delta;
        g.position.z += dir.z * w.speed * delta;
        g.rotation.y = THREE.MathUtils.lerp(g.rotation.y, Math.atan2(dir.x, dir.z), 0.2);
      } else {
        w.grillTimer += delta;
        if (w.grillTimer >= 0.4 && w.carrying < 4) {
          w.grillTimer = 0;
          w.carrying++;
          updateWorkerTray(w);
        }
        if (w.carrying >= 2) {
          // look for a waiting customer
          const target = customers.find(c => c.state === 'seated' && c.served < c.needed);
          if (target) {
            w.state = 'toCustomer';
            w.targetCustomer = target;
          }
        }
      }
      continue;
    }

    if (w.state === 'toCustomer') {
      const target = w.targetCustomer;
      if (!target || target.state !== 'seated' || target.served >= target.needed) {
        w.state = 'toGrill';
        continue;
      }
      const dir = new THREE.Vector3().subVectors(target.table.position, g.position);
      dir.y = 0;
      const dist = dir.length();
      if (dist > 2.0) {
        dir.normalize();
        g.position.x += dir.x * w.speed * delta;
        g.position.z += dir.z * w.speed * delta;
        g.rotation.y = THREE.MathUtils.lerp(g.rotation.y, Math.atan2(dir.x, dir.z), 0.2);
      } else {
        w.serveTimer += delta;
        if (w.serveTimer >= 0.35 && w.carrying > 0) {
          w.serveTimer = 0;
          w.carrying--;
          target.served++;
          updateWorkerTray(w);
          if (target.served >= target.needed) {
            target.state = 'eating';
            target.eatTimer = 0;
            target.bubble.visible = false;
            target.needText.visible = false;
            w.state = 'toGrill';
          }
        }
        if (w.carrying <= 0) w.state = 'toGrill';
      }
      continue;
    }
  }
}

/* ------------------------------------ Update: Cash pickups ------------------------- */
function updateCashPickups(delta) {
  for (let i = cashPickups.length - 1; i >= 0; i--) {
    const p = cashPickups[i];
    p.life += delta;
    p.group.rotation.y += delta * 1.5;
    p.group.position.y = 0.05 + Math.sin(p.life * 3) * 0.03;
    const dist = player.position.distanceTo(p.group.position);
    if (dist < 1.0) {
      state.cash += p.value;
      spawnParticleBurst(p.group.position, 0x8effa0, 5);
      scene.remove(p.group);
      cashPickups.splice(i, 1);
    }
  }
}

/* ------------------------------------ Update: Unlock zones -------------------------- */
function unlockTable(index) {
  const table = tables[index];
  table.unlocked = true;
  table.mesh.visible = true;
  const targetScale = 1;
  let t = 0;
  const anim = () => {
    t += 0.06;
    const s = Math.min(targetScale, t);
    const eased = 1 - Math.pow(1 - s, 3);
    table.mesh.scale.setScalar(eased);
    if (s < targetScale) requestAnimationFrame(anim);
  };
  anim();
  showToast('Table unlocked!');
  updateTableCounter();
}

function unlockWorker() {
  hireWorker();
  showToast('Worker hired!');
  const idx = unlockZones.indexOf(workerPad);
  if (idx >= 0) unlockZones.splice(idx, 1);
  scene.remove(workerPad.group);
  if (state.workers < state.maxWorkers) {
    spawnWorkerPad();
  } else {
    workerPad = null;
  }
}

function updateUnlockZones(delta) {
  for (const zone of unlockZones) {
    if (zone.done) continue;
    const dist = player.position.distanceTo(zone.position);
    if (dist < zone.radius && state.cash > 0) {
      const drain = Math.min(60 * delta, state.cash, zone.cost - zone.progress);
      state.cash -= drain;
      zone.progress += drain;
      const frac = zone.progress / zone.cost;
      zone.fill.scale.set(frac, frac, frac);
      if (zone.progress >= zone.cost - 0.001) {
        zone.done = true;
        scene.remove(zone.group);
        if (zone.type === 'table') unlockTable(zone.tableIndex);
        if (zone.type === 'worker') unlockWorker();
      }
    }
  }
  // clean done zones from array occasionally
  for (let i = unlockZones.length - 1; i >= 0; i--) {
    if (unlockZones[i].done) unlockZones.splice(i, 1);
  }
}

/* ------------------------------------ Update: Particles ------------------------------ */
function updateParticles(delta) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= delta * 1.2;
    p.vel.y -= 4 * delta;
    p.mesh.position.addScaledVector(p.vel, delta);
    p.mesh.material.opacity = Math.max(0, p.life);
    p.mesh.scale.setScalar(Math.max(0.001, p.life));
    if (p.life <= 0) {
      scene.remove(p.mesh);
      particles.splice(i, 1);
    }
  }
}

/* ------------------------------------ Spawning + HUD ---------------------------------- */
function updateTableCounter() {
  const unlockedCount = tables.filter(t => t.unlocked).length;
  document.getElementById('tableCount').textContent = `${unlockedCount}/${tables.length}`;
}
updateTableCounter();

function updateSpawning(delta) {
  state.spawnTimer += delta;
  if (state.spawnTimer >= state.spawnInterval) {
    state.spawnTimer = 0;
    spawnCustomer();
  }
}

function updateHUD() {
  document.getElementById('cashVal').textContent = Math.floor(state.cash);
}

/* ------------------------------------ Resize ------------------------------------------ */
function onResize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  setCameraFrustum();
}
window.addEventListener('resize', onResize);
onResize();

/* ------------------------------------ Main loop ----------------------------------------- */
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(state.clock.getDelta(), 0.05);

  updatePlayer(delta);
  updatePlayerGrill(delta);
  updatePlayerServing(delta);
  updateCustomers(delta);
  updateWorkers(delta);
  updateCashPickups(delta);
  updateUnlockZones(delta);
  updateParticles(delta);
  updateSpawning(delta);
  updateHUD();

  renderer.render(scene, camera);
}
animate();

</script>
</body>
