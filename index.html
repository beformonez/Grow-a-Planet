<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Burger Rush 🍔 — Stickman Edition</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    width: 100%; height: 100%;
    background: #ffeaa7;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: fixed; top: 0; left: 0; width: 100%;
    pointer-events: none; z-index: 10;
  }
  #cashBar {
    position: absolute; top: 16px; left: 16px;
    background: #2ed573;
    border: 4px solid #000000;
    border-radius: 20px;
    padding: 8px 22px;
    color: #fff; font-weight: 900; font-size: 26px;
    box-shadow: 0 6px 0 #000;
  }
  #cashBar span { color: #ffffff; }
  #title {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    color: #ff4757; font-size: 26px; font-weight: 900; letter-spacing: 1px;
    text-shadow: 3px 3px 0px #000;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.2));
  }
  #stats {
    position: absolute; top: 16px; right: 16px;
    background: #ffffff;
    border: 4px solid #000000;
    border-radius: 16px;
    padding: 8px 14px;
    color: #000000; font-weight: 800; font-size: 14px; line-height: 1.4em;
    text-align: right;
    box-shadow: 0 6px 0 #000;
  }
  #toast {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 18px; font-weight: 800;
    background: #ff4757; padding: 10px 20px; border-radius: 30px;
    border: 4px solid #000;
    box-shadow: 0 6px 0 #000;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    transform: translateX(-50%) scale(0.8);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

  #joystickBase {
    position: fixed; bottom: 40px; left: 40px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.8);
    border: 4px solid #000000;
    box-shadow: 0 6px 0 #000;
    z-index: 20; touch-action: none;
    box-sizing: border-box;
  }
  #joystickKnob {
    position: absolute; top: 50%; left: 50%;
    width: 50px; height: 50px; border-radius: 50%;
    background: #ff4757;
    border: 3px solid #000000;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-sizing: border-box;
  }
  #controlsHint {
    position: fixed; bottom: 40px; right: 20px;
    color: #000; font-size: 13px; font-weight: 800; text-align: right;
    background: #ffffff; padding: 10px 14px; border-radius: 14px;
    border: 3px solid #000;
    z-index: 15; max-width: 220px;
    box-shadow: 0 4px 0 #000;
  }
  @media (max-width: 700px) {
    #controlsHint { display: none; }
  }

  #loadingOverlay {
    position: fixed; inset: 0; z-index: 100;
    background: #ffeaa7;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    transition: opacity 0.4s;
  }
  #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
  #loadingSpinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 8px solid #ff4757; border-top-color: transparent;
    animation: spin 0.8s linear infinite;
    margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingText {
    color: #2f3542; font-weight: 900; font-size: 18px;
  }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div id="loadingSpinner"></div>
  <div id="loadingText">Firing up the grill…</div>
</div>

<div id="hud">
  <div id="title">🍔 BURGER RUSH</div>
  <div id="cashBar">$<span id="cashVal">0</span></div>
  <div id="stats">
    Tables: <span id="tableCount">0/0</span><br>
    Staff: <span id="workerCount">0</span>
  </div>
  <div id="toast"></div>
</div>

<div id="joystickBase">
  <div id="joystickKnob"></div>
</div>

<div id="controlsHint">
  WASD / Joystick to move<br>
  Camera follows player! 🎥<br>
  Cook & Serve Burgers 🍔
</div>

<canvas id="gameCanvas"></canvas>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Burger Rush 🍔 — Stickman Edition</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    width: 100%; height: 100%;
    background: #ffeaa7;
    font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: fixed; top: 0; left: 0; width: 100%;
    pointer-events: none; z-index: 10;
  }
  #cashBar {
    position: absolute; top: 16px; left: 16px;
    background: #2ed573;
    border: 4px solid #000000;
    border-radius: 20px;
    padding: 8px 22px;
    color: #fff; font-weight: 900; font-size: 26px;
    box-shadow: 0 6px 0 #000;
  }
  #cashBar span { color: #ffffff; }
  #title {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    color: #ff4757; font-size: 26px; font-weight: 900; letter-spacing: 1px;
    text-shadow: 3px 3px 0px #000;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.2));
  }
  #stats {
    position: absolute; top: 16px; right: 16px;
    background: #ffffff;
    border: 4px solid #000000;
    border-radius: 16px;
    padding: 8px 14px;
    color: #000000; font-weight: 800; font-size: 14px; line-height: 1.4em;
    text-align: right;
    box-shadow: 0 6px 0 #000;
  }
  #toast {
    position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
    color: #fff; font-size: 18px; font-weight: 800;
    background: #ff4757; padding: 10px 20px; border-radius: 30px;
    border: 4px solid #000;
    box-shadow: 0 6px 0 #000;
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    transform: translateX(-50%) scale(0.8);
  }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

  #joystickBase {
    position: fixed; bottom: 40px; left: 40px;
    width: 120px; height: 120px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.8);
    border: 4px solid #000000;
    box-shadow: 0 6px 0 #000;
    z-index: 20; touch-action: none;
    box-sizing: border-box;
  }
  #joystickKnob {
    position: absolute; top: 50%; left: 50%;
    width: 50px; height: 50px; border-radius: 50%;
    background: #ff4757;
    border: 3px solid #000000;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-sizing: border-box;
  }
  #controlsHint {
    position: fixed; bottom: 40px; right: 20px;
    color: #000; font-size: 13px; font-weight: 800; text-align: right;
    background: #ffffff; padding: 10px 14px; border-radius: 14px;
    border: 3px solid #000;
    z-index: 15; max-width: 220px;
    box-shadow: 0 4px 0 #000;
  }
  @media (max-width: 700px) {
    #controlsHint { display: none; }
  }

  #loadingOverlay {
    position: fixed; inset: 0; z-index: 100;
    background: #ffeaa7;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    transition: opacity 0.4s;
  }
  #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
  #loadingSpinner {
    width: 56px; height: 56px; border-radius: 50%;
    border: 8px solid #ff4757; border-top-color: transparent;
    animation: spin 0.8s linear infinite;
    margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loadingText {
    color: #2f3542; font-weight: 900; font-size: 18px;
  }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div id="loadingSpinner"></div>
  <div id="loadingText">Firing up the grill…</div>
</div>

<div id="hud">
  <div id="title">🍔 BURGER RUSH</div>
  <div id="cashBar">$<span id="cashVal">0</span></div>
  <div id="stats">
    Tables: <span id="tableCount">0/0</span><br>
    Staff: <span id="workerCount">0</span>
  </div>
  <div id="toast"></div>
</div>

<div id="joystickBase">
  <div id="joystickKnob"></div>
</div>

<div id="controlsHint">
  WASD / Joystick to move<br>
  Camera follows player! 🎥<br>
  Cook & Serve Burgers 🍔
</div>

<canvas id="gameCanvas"></canvas>
