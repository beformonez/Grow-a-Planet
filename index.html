<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Burger Rush 🍔 — Stickman Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700;900&family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --font-display: 'Baloo 2', 'Fredoka', 'Comic Sans MS', sans-serif;
    --font-ui: 'Fredoka', 'Comic Sans MS', sans-serif;
    --ink: #2b2140;
    --cream: #fff6e0;
    --amber: #ffb400;
    --red: #ff4d5e;
    --red-dark: #e6394a;
    --green: #29cc7a;
    --green-dark: #1fa863;
    --blue: #3aa0ff;
  }
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    width: 100%; height: 100%;
    background: radial-gradient(120% 120% at 50% -10%, #e8f4fc 0%, #d4e8f7 55%, #c5dff0 100%);
    font-family: var(--font-ui);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #gameCanvas { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: fixed; top: 0; left: 0; width: 100%;
    pointer-events: none; z-index: 10;
  }

  /* ---------- Currency pill ---------- */
  #cashBar {
    position: absolute; top: 16px; left: 16px;
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(180deg, #3fe08f 0%, var(--green) 55%, var(--green-dark) 100%);
    border: 3px solid rgba(0,0,0,0.85);
    border-radius: 24px;
    padding: 9px 22px 9px 14px;
    color: #fff; font-family: var(--font-display); font-weight: 800; font-size: 26px;
    box-shadow: 0 5px 0 var(--green-dark), 0 12px 24px rgba(20,120,70,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
    letter-spacing: 0.2px;
    transition: transform 0.12s ease;
  }
  #cashBar.bump { animation: cashBump 0.28s ease; }
  @keyframes cashBump { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #cashIcon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 50%;
    background: #ffdd57; color: #7a5600; font-size: 15px; font-weight: 900;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15), 0 1px 0 rgba(255,255,255,0.6);
  }
  #cashBar span { color: #ffffff; text-shadow: 0 2px 0 rgba(0,0,0,0.15); }

  /* ---------- Level pill (compact) ---------- */
  #levelBar {
    position: absolute; top: 16px; right: 16px;
    display: flex; align-items: center; gap: 8px;
    background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
    border: 3px solid rgba(0,0,0,0.85);
    border-radius: 24px;
    padding: 8px 16px 8px 12px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.7), 0 10px 18px rgba(0,0,0,0.12);
    font-family: var(--font-display); font-weight: 800;
  }
  #levelBadge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 36px; height: 28px; padding: 0 8px;
    border-radius: 14px;
    background: linear-gradient(180deg, #5dade2 0%, #3498db 100%);
    color: #fff; font-size: 15px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);
  }
  #levelXp {
    display: flex; flex-direction: column; gap: 3px; min-width: 72px;
  }
  #levelXpLabel {
    font-size: 11px; color: var(--ink); opacity: 0.7; font-family: var(--font-ui); font-weight: 700;
  }
  #levelXpTrack {
    height: 8px; border-radius: 4px; background: #d5e4f0; overflow: hidden;
    border: 1px solid rgba(0,0,0,0.15);
  }
  #levelXpFill {
    height: 100%; width: 0%; border-radius: 4px;
    background: linear-gradient(90deg, #2ecc71, #27ae60);
    transition: width 0.25s ease;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: absolute; top: 70px; left: 50%; transform: translateX(-50%) scale(0.8);
    font-family: var(--font-display);
    color: #fff; font-size: 16px; font-weight: 700;
    background: linear-gradient(180deg, #ff7b89 0%, var(--red) 55%, var(--red-dark) 100%);
    padding: 11px 26px; border-radius: 30px;
    border: 3px solid rgba(0,0,0,0.85);
    box-shadow: 0 5px 0 var(--red-dark), 0 12px 24px rgba(230,57,74,0.35);
    opacity: 0; transition: opacity 0.3s, transform 0.3s;
    letter-spacing: 0.2px;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) scale(1); }

  /* ---------- Free floating joystick (small, dim when idle, rests on right) ---------- */
  #joystickBase {
    position: fixed;
    bottom: 32px; right: 28px; left: auto;
    width: 96px; height: 96px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0.28) 60%);
    border: 3px solid rgba(0,0,0,0.35);
    box-shadow: 0 4px 0 rgba(0,0,0,0.25), inset 0 1px 4px rgba(255,255,255,0.4);
    z-index: 20; touch-action: none;
    box-sizing: border-box;
    opacity: 0.45;
    transition: opacity 0.15s ease, transform 0.1s ease;
    pointer-events: none; /* only activated by global touch in bottom half */
  }
  #joystickBase.active {
    opacity: 0.92;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(255,255,255,0.55) 60%);
    border-color: rgba(0,0,0,0.75);
  }
  #joystickKnob {
    position: absolute; top: 50%; left: 50%;
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(180deg, #ff7b89 0%, var(--red) 60%, var(--red-dark) 100%);
    border: 2px solid rgba(0,0,0,0.7);
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-sizing: border-box;
    box-shadow: 0 3px 0 var(--red-dark), inset 0 1px 3px rgba(255,255,255,0.45);
  }

  /* ---------- Loading screen ---------- */
  #loadingOverlay {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(120% 120% at 50% -10%, #e8f4fc 0%, #d4e8f7 55%, #c5dff0 100%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column;
    transition: opacity 0.4s;
  }
  #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
  #loadingBadge {
    font-size: 54px; margin-bottom: 6px;
    animation: floatBob 1.6s ease-in-out infinite;
  }
  @keyframes floatBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  #loadingTitle {
    font-family: var(--font-display);
    color: #fff8ec; font-size: 30px; font-weight: 800; letter-spacing: 0.5px;
    -webkit-text-stroke: 2px var(--ink);
    text-shadow: 0 4px 0 var(--red-dark), 0 8px 16px rgba(0,0,0,0.25);
    margin-bottom: 22px;
  }
  #loadingDots { display: flex; gap: 10px; margin-bottom: 16px; }
  #loadingDots span {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--red);
    border: 2px solid rgba(0,0,0,0.85);
    animation: dotPulse 1.1s ease-in-out infinite;
  }
  #loadingDots span:nth-child(2) { animation-delay: 0.15s; background: var(--amber); }
  #loadingDots span:nth-child(3) { animation-delay: 0.3s; background: var(--green); }
  @keyframes dotPulse { 0%, 80%, 100% { transform: translateY(0); opacity: 0.55; } 40% { transform: translateY(-10px); opacity: 1; } }
  #loadingText {
    color: var(--ink); font-weight: 700; font-size: 15px;
  }
</style>
</head>
<body>

<div id="loadingOverlay">
  <div id="loadingBadge">🍔</div>
  <div id="loadingTitle">BURGER RUSH</div>
  <div id="loadingDots"><span></span><span></span><span></span></div>
  <div id="loadingText">Firing up the grill…</div>
</div>

<div id="hud">
  <div id="cashBar"><span id="cashIcon">$</span><span id="cashVal">0</span></div>
  <div id="levelBar">
    <span id="levelBadge">Lv.1</span>
    <div id="levelXp">
      <span id="levelXpLabel">0 / 8</span>
      <div id="levelXpTrack"><div id="levelXpFill"></div></div>
    </div>
  </div>
  <div id="toast"></div>
</div>

<div id="joystickBase">
  <div id="joystickKnob"></div>
</div>

<canvas id="gameCanvas"></canvas>

function base64ToArrayBuffer(base64) {
  const binary = atob(base64);
  const len = binary.length;
  const bytes = new Uint8Array(len);
  for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
  return bytes.buffer;
}

/* --------------------------- Helper: OUTLINE BUILDER ---------------------------- */
// Used for the low-poly props (grill, tables, burgers, walls). Skinned
// meshes (the stickman) are excluded since a naive outline clone breaks
// skinning, so humanoids rely on the model's own shading instead.
function addOutline(mesh, thickness = 0.04, color = 0x000000) {
  if (!mesh.geometry) return;
  const outlineMat = new THREE.MeshBasicMaterial({ color, side: THREE.BackSide });
  const outlineMesh = new THREE.Mesh(mesh.geometry, outlineMat);
  outlineMesh.scale.setScalar(1 + thickness);
  mesh.add(outlineMesh);
}

function makeCanvasTexture(draw, w = 256, h = 256) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  return tex;
}

// In-world text/labels (signs, price tags, order bubbles) drawn to a canvas
// texture. Uses the same webfont as the HUD once it's ready (see
// loadGameFont() below); falls back to a bold system sans-serif instantly
// if the font hasn't finished loading, so nothing ever blocks on it.
const GAME_FONT_FAMILY = "'Baloo 2'";
let gameFontReady = false;

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function makeSprite(text, opts = {}) {
  const {
    fontSize = 64, bg = 'rgba(0,0,0,0)', color = '#000',
    padding = 14, scale = 1.0, bold = true
  } = opts;
  const fontFamily = `${gameFontReady ? GAME_FONT_FAMILY : 'sans-serif'}`;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `${bold ? '800' : '600'} ${fontSize}px ${fontFamily}`;
  const metrics = ctx.measureText(text);
  const pad = padding + 6;
  c.width = Math.ceil(metrics.width) + pad * 2;
  c.height = fontSize + pad * 2;

  const hasBg = bg !== 'rgba(0,0,0,0)';
  if (hasBg) {
    roundRectPath(ctx, 3, 3, c.width - 6, c.height - 6, Math.min(24, c.height * 0.32));
    ctx.fillStyle = bg;
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,0.85)';
    ctx.stroke();
  }

  ctx.font = `${bold ? '800' : '600'} ${fontSize}px ${fontFamily}`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';

  // Soft drop shadow behind the glyphs, then a thin dark outline, then fill —
  // reads far punchier than a flat single-color fill at game scale.
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = hasBg ? 0 : 10;
  ctx.shadowOffsetY = hasBg ? 0 : 3;
  ctx.lineWidth = Math.max(3, fontSize * 0.07);
  ctx.strokeStyle = 'rgba(0,0,0,0.8)';
  ctx.strokeText(text, c.width / 2, c.height / 2 + 2);
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = color;
  ctx.fillText(text, c.width / 2, c.height / 2 + 2);
  ctx.restore();

  const tex = new THREE.CanvasTexture(c);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true });
  const sprite = new THREE.Sprite(mat);
  const ratio = c.width / c.height;
  sprite.scale.set(ratio * scale, scale, 1);
  return sprite;
}

// Flat, slightly-raised rings painted on the floor so the player can see at
// a glance where each functional area (grill, queue line, tables) is,
// without needing to guess from the 3D props alone.
function addZoneMarker(pos, radius, color, opacity = 0.35) {
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(radius * 0.82, radius, 28),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.copy(pos); ring.position.y = 0.012;
  scene.add(ring);
  return ring;
}

// A two-sprite health-bar-style widget (dark backing + colored fill).
// Sprite.center is set to (0,0.5) so the fill scales from its LEFT edge,
// which is what makes it read as a shrinking/filling progress bar instead
// of scaling from the middle. Used above customer heads for both "waiting
// for a table" and "waiting for food" progress.
function makeProgressBar(width = 1.1, height = 0.16) {
  const group = new THREE.Group();

  const bg = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0x2f3542, transparent: true, opacity: 0.9 }));
  bg.center.set(0, 0.5);
  bg.scale.set(width, height, 1);
  bg.position.set(-width / 2, 0, 0);
  group.add(bg);

  const fill = new THREE.Sprite(new THREE.SpriteMaterial({ color: 0x2ed573 }));
  fill.center.set(0, 0.5);
  fill.scale.set(width, height * 0.72, 1);
  fill.position.set(-width / 2, 0, 0.001);
  group.add(fill);

  group.userData = { fill, width };
  return group;
}

function setProgressBar(bar, frac) {
  frac = THREE.MathUtils.clamp(frac, 0, 1);
  bar.userData.fill.scale.x = bar.userData.width * frac;
  // Green while plenty of time/progress remains, sliding to red as it runs out.
  const c = new THREE.Color();
  if (frac > 0.5) c.lerpColors(new THREE.Color(0xffa502), new THREE.Color(0x2ed573), (frac - 0.5) * 2);
  else c.lerpColors(new THREE.Color(0xff4757), new THREE.Color(0xffa502), frac * 2);
  bar.userData.fill.material.color.copy(c);
}

/* ---------------------------------- Floor -------------------------------- */
function buildFloor() {
  // Clean light-grey tiled floor (tycoon style)
  const tex = makeCanvasTexture((ctx, w, h) => {
    const tiles = 10;
    const s = w / tiles;
    ctx.fillStyle = '#f2f6fa';
    ctx.fillRect(0, 0, w, h);
    for (let y = 0; y < tiles; y++) {
      for (let x = 0; x < tiles; x++) {
        // subtle checker
        if ((x + y) % 2 === 0) {
          ctx.fillStyle = '#e8eef5';
          ctx.fillRect(x * s, y * s, s, s);
        }
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#c5d0dc';
        ctx.strokeRect(x * s + 0.5, y * s + 0.5, s - 1, s - 1);
      }
    }
  }, 512, 512);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(8, 7);

  const floorGeo = new THREE.PlaneGeometry(FLOOR_HALF_X * 2, FLOOR_MAX_Z - FLOOR_MIN_Z);
  const floorMat = new THREE.MeshBasicMaterial({ map: tex });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, 0, (FLOOR_MAX_Z + FLOOR_MIN_Z) / 2);
  scene.add(floor);

  // Soft blue walls (like the reference pizza shop)
  const wallMat = new THREE.MeshBasicMaterial({ color: 0x5ba4d9 });
  const backWall = new THREE.Mesh(new THREE.BoxGeometry(FLOOR_HALF_X * 2, 3.4, 0.35), wallMat);
  backWall.position.set(0, 1.7, FLOOR_MIN_Z);
  addOutline(backWall, 0.015);
  scene.add(backWall);

  // White trim / baseboard on back wall
  const trim = new THREE.Mesh(new THREE.BoxGeometry(FLOOR_HALF_X * 2, 0.22, 0.38), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  trim.position.set(0, 0.11, FLOOR_MIN_Z);
  addOutline(trim, 0.01);
  scene.add(trim);

  const sideMat = new THREE.MeshBasicMaterial({ color: 0x7bb8e0 });
  const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.35, 3.4, FLOOR_MAX_Z - FLOOR_MIN_Z), sideMat);
  wallL.position.set(-FLOOR_HALF_X, 1.7, (FLOOR_MAX_Z + FLOOR_MIN_Z) / 2);
  addOutline(wallL, 0.015);
  scene.add(wallL);

  const wallR = wallL.clone();
  wallR.position.x = FLOOR_HALF_X;
  scene.add(wallR);
}
// Give the webfont a brief chance to finish loading before we start baking
// text into canvas textures — falls back to a system sans-serif and moves
// on if it takes too long, so a slow/blocked font fetch never stalls the game.
async function loadGameFont() {
  try {
    await Promise.race([
      Promise.all([
        document.fonts.load("800 64px 'Baloo 2'"),
        document.fonts.load("700 64px 'Fredoka'"),
      ]),
      new Promise((_, reject) => setTimeout(() => reject(new Error('font timeout')), 1200)),
    ]);
    gameFontReady = true;
  } catch (e) {
    gameFontReady = false;
  }
}
await loadGameFont();

let stickmanTemplate = null;
let stickmanClips = null;
const allMixers = [];

// Builds one animated stickman instance with an optional tinted body,
// cap, and apron so player / staff / guests stay visually distinct.
function createHumanoid({ tint = 0xffffff, role = 'customer' } = {}) {
  const root = new THREE.Group();

  const model = SkeletonUtils.clone(stickmanTemplate);

  // Base body color + outline
  const meshesToOutline = [];
  model.traverse(o => {
    if (o.isMesh) {
      o.material = new THREE.MeshBasicMaterial({
        color: new THREE.Color(tint),
        side: THREE.DoubleSide,
      });
      o.frustumCulled = false;
      meshesToOutline.push(o);
    }
  });
  for (const mesh of meshesToOutline) {
    const outlineMat = new THREE.MeshBasicMaterial({
      color: 0x000000,
      side: THREE.BackSide,
    });
    const outline = new THREE.Mesh(mesh.geometry, outlineMat);
    outline.scale.setScalar(1.06);
    outline.frustumCulled = false;
    mesh.add(outline);
  }

  const ORIGINAL_HEIGHT = 2.06;
  const scale = HUMANOID_HEIGHT / ORIGINAL_HEIGHT;
  model.scale.setScalar(scale);
  model.rotation.y = STICKMAN_FACING_OFFSET;
  model.position.y = -0.02;
  root.add(model);

  // Animation
  const mixer = new THREE.AnimationMixer(model);
  const idleClip = THREE.AnimationClip.findByName(stickmanClips, 'Idle') || stickmanClips[0];
  const runClip = THREE.AnimationClip.findByName(stickmanClips, 'Run') || stickmanClips[1] || stickmanClips[0];
  const actions = {
    idle: mixer.clipAction(idleClip),
    run: mixer.clipAction(runClip),
  };
  actions.idle.setEffectiveWeight(1).play();
  allMixers.push(mixer);

  // ===== Clothes attached to bones so they follow Idle / Run animation =====
  // Geometry sizes are in the *original* model units; the parent bone is
  // already under the scaled model, so they grow correctly with the character.
  function findBone(part) {
    let found = null;
    model.traverse(o => {
      if (!found && o.isBone && o.name && o.name.includes(part)) found = o;
    });
    return found;
  }
  const boneHips  = findBone('Hips');
  const boneSpine = findBone('Spine2') || findBone('Spine1') || findBone('Spine');
  // Prefer the actual Head bone (exclude HeadTop_End)
  let headBone = null;
  model.traverse(o => {
    if (o.isBone && o.name && o.name.includes('Head') && !o.name.includes('Top') && !o.name.includes('End')) {
      headBone = o;
    }
  });

  function makeClothesMesh(geo, color) {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
    m.frustumCulled = false;
    // thin black outline so clothes read clearly at game scale
    const outline = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.BackSide }));
    outline.scale.setScalar(1.07);
    outline.frustumCulled = false;
    m.add(outline);
    return m;
  }

  if (role === 'player' || role === 'worker') {
    const shirtColor = role === 'player' ? 0xff4757 : 0x1e90ff;
    const hatColor   = shirtColor;

    // Torso shirt — follows spine
    if (boneSpine) {
      const shirt = makeClothesMesh(new THREE.CylinderGeometry(0.19, 0.22, 0.42, 10), shirtColor);
      shirt.position.set(0, 0.02, 0.01);
      boneSpine.add(shirt);
    }

    // Pants — follows hips
    if (boneHips) {
      const pants = makeClothesMesh(new THREE.CylinderGeometry(0.16, 0.18, 0.38, 8), 0x2f3542);
      pants.position.set(0, -0.12, 0);
      boneHips.add(pants);
    }

    // Cap — follows head
    if (headBone) {
      const hat = makeClothesMesh(new THREE.CylinderGeometry(0.14, 0.16, 0.10, 12), hatColor);
      hat.position.set(0, 0.14, 0.02);
      headBone.add(hat);
      if (role === 'player') {
        const brim = makeClothesMesh(new THREE.CylinderGeometry(0.20, 0.20, 0.03, 12), hatColor);
        brim.position.set(0, 0.10, 0.03);
        headBone.add(brim);
      }
    }

    // Worker apron on spine (front)
    if (role === 'worker' && boneSpine) {
      const apron = makeClothesMesh(new THREE.BoxGeometry(0.30, 0.36, 0.04), 0xffffff);
      apron.position.set(0, -0.08, 0.14);
      boneSpine.add(apron);
    }
  }
  // customers: body tint only (no extra clothes)

  root.userData.mixer = mixer;
  root.userData.actions = actions;
  root.userData.activeAction = 'idle';
  root.userData.walkPhase = Math.random() * 10;
  return root;
}

function setHumanoidAction(root, name) {
  if (root.userData.activeAction === name) return;
  const actions = root.userData.actions;
  const next = actions[name];
  const prev = actions[root.userData.activeAction];
  next.reset().setEffectiveWeight(1).fadeIn(0.2).play();
  if (prev) prev.fadeOut(0.2);
  root.userData.activeAction = name;
}

// Grows freshly-stacked items from 0 -> full size with a slight overshoot so
// picking up a burger reads as a distinct, juicy event rather than a pop.
const POP_DURATION = 0.18;
function animatePopScale(mesh, baseScale, delta) {
  if (mesh.userData.popT === undefined || mesh.userData.popT >= 1) return;
  mesh.userData.popT = Math.min(1, mesh.userData.popT + delta / POP_DURATION);
  const t = mesh.userData.popT;
  // Overshoot-then-settle easing (back-out).
  const overshoot = 1.7;
  const eased = 1 + overshoot * Math.pow(t - 1, 3) + overshoot * Math.pow(t - 1, 2);
  mesh.scale.setScalar(Math.max(0.001, eased * baseScale));
  if (t >= 1) mesh.scale.setScalar(baseScale);
}

function animateStackPops(delta) {
  for (const b of trayBurgers) animatePopScale(b, 0.42, delta);
  for (const w of workers) for (const b of w.trayMeshes) animatePopScale(b, 0.40, delta);
}

function createUnlockPad(pos, cost, { locked = false, icon = '🍽️' } = {}) {

    new THREE.MeshBasicMaterial({ color: locked ? 0xb0b7be : 0x2ecc71, side: THREE.DoubleSide })
  );

  base.position.y = 0.014;

  const fill = new THREE.Mesh(

    : makeSprite(`${cost}`, { fontSize: 64, color: '#ffffff', bg: 'rgba(0,0,0,0)', scale: 0.9 });
  label.position.set(0, 0.08, 0);

  const iconSpr = makeSprite(icon, { fontSize: 40, color: '#ffffff', bg: 'rgba(0,0,0,0)', scale: 0.42 });
  iconSpr.position.set(0, 0.9, 0);
  g.add(iconSpr);

  g.position.copy(pos);
  scene.add(g);
  return {
    group: g, fill, label, iconSpr, base, border,
    cost, progress: 0, position: pos.clone(), radius: 1.15,
    done: false, locked, size,
  };
}

function setPadLocked(pad, locked) {
  pad.locked = locked;

    pad.label = makeSprite(`${pad.cost}`, { fontSize: 64, color: '#ffffff', bg: 'rgba(0,0,0,0)', scale: 0.9 });

function spawnWorkerPad() {

function spawnSpeedPad() {

function spawnGrillPad() {
  if (state.grillLevel >= state.maxUpgradeLevel) { grillPad = null; return; }
  const cost = GRILL_BASE_COST + state.grillLevel * 35;
  const pos = new THREE.Vector3(-9.0, 0, -1.5);

// Only the next sequential table that meets level requirement is buyable
function refreshTablePads() {
  const lockedTables = tables.filter(t => !t.unlocked).sort((a, b) => a.index - b.index);
  // Required level = tableIndex (table 2 → Lv1, table 3 → Lv2, ...)
  let nextBuyable = -1;
  for (const t of lockedTables) {
    const needLv = Math.max(1, t.index - 1);
    if (state.level >= needLv) { nextBuyable = t.index; break; }
  }
  for (const zone of unlockZones) {
    if (zone.type !== 'table' || zone.done) continue;
    setPadLocked(zone, zone.tableIndex !== nextBuyable);
  }
  // Worker pad: available from level 2
  if (workerPad && !workerPad.done) {
    setPadLocked(workerPad, state.level < 2);
  }
}
refreshTablePads();

const customers = [];   // everyone currently on the floor: queueing, seated or eating
const queue = [];       // subset of `customers` who are in line for a table
const cashPickups = [];

const SHIRT_COLORS = [0xff4757, 0x2ed573, 0x1e90ff, 0xffa502, 0x9b59b6, 0xff6b81];

const QUEUE_PATIENCE = 16;   // seconds a guest waits in line before giving up
const SEATED_PATIENCE = 26;  // seconds a seated guest waits for food before leaving
const EAT_DURATION = 1.5;    // seconds spent eating once fully served

// Keeps queued guests' target spots contiguous whenever someone joins or
// leaves the line (either seated or gave up), so the line always shuffles
// forward instead of leaving a gap.
function refreshQueuePositions() {
  queue.forEach((c, idx) => { if (c.state === 'queueing') c.target = getQueueSpot(idx); });
}

// Called whenever a table becomes free (guest finished eating, or a seated
// guest's patience ran out). Pulls the next person in line, if any, straight
// to that table.
function freeTableAndPullQueue(table) {
  table.occupied = false;
  table.customer = null;
  if (queue.length === 0) return;
  const next = queue.shift();
  // Queued guests already have their burgers — send them to sit & eat
  next.table = table;
  table.occupied = true;
  table.customer = next;
  next.state = 'toTable';
  next.target = table.position.clone().add(table.seatOffset);
  refreshQueuePositions();
}

function findFreeTable() {
  const free = tables.filter(t => t.unlocked && !t.occupied);
  if (free.length === 0) return null;
  return free[Math.floor(Math.random() * free.length)];
}

function spawnCustomer() {
  // Always enter at door near grill, walk to order window first
  if (queue.length >= QUEUE_MAX && !findFreeTable()) return;

  const cust = createHumanoid({
    tint: SHIRT_COLORS[Math.floor(Math.random() * SHIRT_COLORS.length)],
  });
  cust.position.copy(DOOR_POS);
  scene.add(cust);

  const bubble = makeSprite('🍔', { fontSize: 70, bg: '#ffffff', scale: 0.8 });
  bubble.position.set(0, 2.5, 0); cust.add(bubble); bubble.visible = false;

  const needed = 1 + Math.floor(Math.random() * 3);
  const needText = makeSprite(`x${needed}`, { fontSize: 44, color: '#ff4757', bg: '#ffffff', scale: 0.5 });
  needText.position.set(0.5, 2.55, 0); cust.add(needText); needText.visible = false;

  const record = {
    group: cust, bubble, needText, table: null, needed, served: 0,
    state: 'toCounter', target: COUNTER_POS.clone(),
    patience: SEATED_PATIENCE, eatTimer: 0, orderTimer: 0, speed: 2.3,
  };

  customers.push(record);
}

function spawnCashPickup(pos) {
  // One money block = two soft green bills stacked (no animation)
  const g = new THREE.Group();
  const mat = new THREE.MeshBasicMaterial({ color: 0x82e0aa });
  for (let i = 0; i < 2; i++) {
    const bill = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.05, 0.3), mat);
    bill.position.y = 0.08 + i * 0.06;
    addOutline(bill, 0.04);
    g.add(bill);
  }
  g.position.copy(pos);
  g.position.y = 0;
  scene.add(g);
  cashPickups.push({ group: g, value: 10 + Math.floor(Math.random() * 10) });
}

/* --------------------------------- Toast Helper ------------------------------ */
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

/* ------------------------------------ JOYSTICK LOGIC ----------------------------------- */
window.addEventListener('keydown', e => { state.keys[e.key.toLowerCase()] = true; });
window.addEventListener('keyup', e => { state.keys[e.key.toLowerCase()] = false; });

const joyBase = document.getElementById('joystickBase');
const joyKnob = document.getElementById('joystickKnob');
let joyTouchId = null;
let joyOriginX = 0, joyOriginY = 0;
const JOY_RADIUS = 48; // half of 96px base

function placeJoystick(x, y) {
  joyBase.style.left = `${x - JOY_RADIUS}px`;
  joyBase.style.top = `${y - JOY_RADIUS}px`;
  joyBase.style.bottom = 'auto';
  joyBase.style.right = 'auto';
  joyOriginX = x;
  joyOriginY = y;
}

function joyStart(x, y, id) {
  // Only activate in lower 60% of the screen so HUD stays tappable
  if (y < window.innerHeight * 0.35) return;
  joyTouchId = id;
  state.joystick.active = true;
  placeJoystick(x, y);
  joyBase.classList.add('active');
  updateJoy(x, y);
}

function updateJoy(x, y) {
  let dx = x - joyOriginX;
  let dy = y - joyOriginY;
  const dist = Math.hypot(dx, dy);
  const maxDist = JOY_RADIUS - 8;
  if (dist > maxDist) {
    dx = (dx / dist) * maxDist;
    dy = (dy / dist) * maxDist;
  }
  joyKnob.style.transform = `translate(${dx}px, ${dy}px) translate(-50%, -50%)`;
  joyKnob.style.left = '50%';
  joyKnob.style.top = '50%';
  state.joystick.x = dx / maxDist;
  state.joystick.y = dy / maxDist;
}

function joyEnd() {
  joyTouchId = null;
  state.joystick.active = false;
  state.joystick.x = 0;
  state.joystick.y = 0;
  joyKnob.style.left = '50%';
  joyKnob.style.top = '50%';
  joyKnob.style.transform = 'translate(-50%, -50%)';
  joyBase.classList.remove('active');
  // Rest dim on the right side when not in use
  joyBase.style.left = 'auto';
  joyBase.style.right = '28px';
  joyBase.style.bottom = '32px';
  joyBase.style.top = 'auto';
}

window.addEventListener('touchstart', e => {
  if (joyTouchId !== null) return;
  const t = e.changedTouches[0];
  joyStart(t.clientX, t.clientY, t.identifier);
}, { passive: true });

window.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === joyTouchId) {
      e.preventDefault();
      updateJoy(t.clientX, t.clientY);
    }
  }
}, { passive: false });

window.addEventListener('touchend', e => {
  for (const t of e.changedTouches) if (t.identifier === joyTouchId) joyEnd();
});
window.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) if (t.identifier === joyTouchId) joyEnd();
});

let mouseDown = false;
window.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  mouseDown = true;
  joyStart(e.clientX, e.clientY, 'mouse');
});
window.addEventListener('mousemove', e => { if (mouseDown && joyTouchId === 'mouse') updateJoy(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false; joyEnd(); } });

/* ------------------------------------ Update Player & Camera --------------------------- */
let playerFacing = 0;

function updatePlayerAndCamera(delta) {
  let mx = 0, mz = 0;
  if (state.keys['w'] || state.keys['arrowup']) mz -= 1;
  if (state.keys['s'] || state.keys['arrowdown']) mz += 1;
  if (state.keys['a'] || state.keys['arrowleft']) mx -= 1;
  if (state.keys['d'] || state.keys['arrowright']) mx += 1;

  mx += state.joystick.x; mz += state.joystick.y;

  const len = Math.hypot(mx, mz);
  if (len > 0.08) {
    mx /= len; mz /= len;
    // Slight speed curve so small stick deflections feel precise, full push is fast
    const speed = state.playerSpeed * (0.55 + 0.45 * Math.min(1, len));
    player.position.x += mx * speed * delta;
    player.position.z += mz * speed * delta;
    player.position.x = THREE.MathUtils.clamp(player.position.x, -FLOOR_HALF_X + 0.5, FLOOR_HALF_X - 0.5);
    player.position.z = THREE.MathUtils.clamp(player.position.z, FLOOR_MIN_Z + 0.5, FLOOR_MAX_Z + 0.3);

    const targetAngle = Math.atan2(mx, mz);
    playerFacing = THREE.MathUtils.lerp(playerFacing, targetAngle, 0.35);
    player.rotation.y = playerFacing;

    setHumanoidAction(player, 'run');
  } else {
    setHumanoidAction(player, 'idle');
  }

  const targetCamPos = player.position.clone().add(CAM_OFFSET);
  camera.position.lerp(targetCamPos, 0.14);
  camera.lookAt(player.position.x, 0.5, player.position.z);
}

/* ------------------------------------ Update Interactions ----------------------------- */
function updatePlayerGrill(delta) {
  const dist = player.position.distanceTo(grillZone.position);
  if (dist < grillZone.radius && state.playerCarrying < state.maxCarry) {
    state.grillTimer += delta;
    if (state.grillTimer >= state.grillCookTime) {
      state.grillTimer = 0;
      state.playerCarrying = Math.min(state.maxCarry, state.playerCarrying + 1);
      updateTrayVisual(state.playerCarrying);
    }
  } else state.grillTimer = 0;
}

// Drop carried burgers onto the order counter for customers to self-serve
function updatePlayerDeposit(delta) {
  if (state.playerCarrying <= 0) { state.serveTimer = 0; return; }
  if (player.position.distanceTo(COUNTER_POS) < COUNTER_RADIUS) {
    state.serveTimer += delta;
    if (state.serveTimer >= 0.2) {
      state.serveTimer = 0;
      state.playerCarrying--;
      counterStock++;
      updateTrayVisual(state.playerCarrying);
      updateCounterVisual();
    }
  } else state.serveTimer = 0;
}

function moveToward(c, delta, arriveDist = 0.2) {
  const g = c.group;
  const dir = new THREE.Vector3().subVectors(c.target, g.position); dir.y = 0;
  if (dir.length() > arriveDist) {
    dir.normalize();
    g.position.x += dir.x * c.speed * delta;
    g.position.z += dir.z * c.speed * delta;
    g.rotation.y = THREE.MathUtils.lerp(g.rotation.y, Math.atan2(dir.x, dir.z), 0.22);
    setHumanoidAction(g, 'run');
    return false;
  }
  setHumanoidAction(g, 'idle');
  return true;
}

function updateCustomers(delta) {
  for (let i = customers.length - 1; i >= 0; i--) {
    const c = customers[i]; const g = c.group;

    // 1) Walk from door → order / pickup counter
    if (c.state === 'toCounter') {
      if (moveToward(c, delta, 0.4)) {
        c.state = 'ordering';
        c.orderTimer = 0;
        g.rotation.y = Math.PI;
        c.bubble.visible = true;
        c.needText.visible = true;
      }
      continue;
    }

    // 2) At order point: take burgers from counter stock, then go sit & eat
    if (c.state === 'ordering') {
      c.orderTimer += delta;
      // Wait until enough burgers are on the counter
      if (counterStock >= c.needed) {
        counterStock -= c.needed;
        c.served = c.needed;
        updateCounterVisual();
        c.bubble.visible = false;
        c.needText.visible = false;

        const table = findFreeTable();
        if (table) {
          table.occupied = true; table.customer = c;
          c.table = table;
          c.state = 'toTable';
          c.target = table.position.clone().add(table.seatOffset);
        } else if (queue.length < QUEUE_MAX) {
          // Has food but no table — wait in queue with food
          c.state = 'queueing';
          c.target = getQueueSpot(queue.length);
          c.patience = QUEUE_PATIENCE;
          queue.push(c);
        } else {
          // Eat standing then leave (no table available)
          c.state = 'eating';
          c.eatTimer = 0;
        }
      } else if (c.orderTimer > 22) {
        // Tired of waiting for food → leave
        c.bubble.visible = false; c.needText.visible = false;
        c.state = 'walkingOut'; c.target = DOOR_POS.clone();
      }
      continue;
    }

    // Queue with food until a table frees up
    if (c.state === 'queueing') {
      moveToward(c, delta, 0.2);
      c.patience -= delta;
      if (c.patience <= 0) {
        const qi = queue.indexOf(c);
        if (qi >= 0) queue.splice(qi, 1);
        refreshQueuePositions();
        // Already paid for food path — just leave
        c.state = 'walkingOut'; c.target = DOOR_POS.clone();
      }
      continue;
    }

    // 3) Walk to table with food → sit → eat
    if (c.state === 'toTable') {
      if (moveToward(c, delta, 0.18)) {
        const toTable = new THREE.Vector3().subVectors(c.table.position, g.position);
        g.rotation.y = Math.atan2(toTable.x, toTable.z);
        g.position.y = 0;
        c.state = 'eating';
        c.eatTimer = 0;
      }
      continue;
    }

    if (c.state === 'walkingOut') {
      if (moveToward(c, delta, 0.25)) {
        scene.remove(g); customers.splice(i, 1);
      }
      continue;
    }

    if (c.state === 'eating') {
      c.eatTimer += delta;
      if (c.eatTimer >= EAT_DURATION) {
        const payPos = c.table
          ? c.table.position.clone().add(new THREE.Vector3(0.85, 0, 0.85))
          : g.position.clone();
        spawnCashPickup(payPos);
        if (c.table) freeTableAndPullQueue(c.table);
        c.state = 'walkingOut'; c.target = DOOR_POS.clone();
        state.servedTotal++;
        checkLevelUp();
      }
    }
  }
}

function updateWorkers(delta) {
  for (const w of workers) {
    const g = w.group;
    // Cook at grill
    if (w.state === 'toGrill') {
      const dir = new THREE.Vector3().subVectors(grillZone.position, g.position); dir.y = 0;
      if (dir.length() > 1.6) {
        dir.normalize();
        g.position.x += dir.x * w.speed * delta;
        g.position.z += dir.z * w.speed * delta;
        g.rotation.y = THREE.MathUtils.lerp(g.rotation.y, Math.atan2(dir.x, dir.z), 0.2);
        setHumanoidAction(g, 'run');
      } else {
        setHumanoidAction(g, 'idle');
        w.grillTimer += delta;
        if (w.grillTimer >= 0.3 && w.carrying < 4) {
          w.grillTimer = 0; w.carrying++; updateWorkerTray(w);
        }
        // When holding enough, deliver to order counter
        if (w.carrying >= 2) w.state = 'toCounter';
      }
      continue;
    }
    // Drop burgers on the order counter for customers
    if (w.state === 'toCounter') {
      const dir = new THREE.Vector3().subVectors(COUNTER_POS, g.position); dir.y = 0;
      if (dir.length() > 1.3) {
        dir.normalize();
        g.position.x += dir.x * w.speed * delta;
        g.position.z += dir.z * w.speed * delta;
        g.rotation.y = THREE.MathUtils.lerp(g.rotation.y, Math.atan2(dir.x, dir.z), 0.2);
        setHumanoidAction(g, 'run');
      } else {
        setHumanoidAction(g, 'idle');
        w.serveTimer += delta;
        if (w.serveTimer >= 0.2 && w.carrying > 0) {
          w.serveTimer = 0;
          w.carrying--;
          counterStock++;
          updateWorkerTray(w);
          updateCounterVisual();
        }
        if (w.carrying <= 0) w.state = 'toGrill';
      }
    }
  }
}

/* ------------------------------ Collision Detector -------------------------------- */
// Cheap O(n^2) circle-vs-circle separation so the player, staff and guests
// never visually stack on top of one another while walking around. Only
// actors that are currently "on foot" are considered — seated/eating
// customers stay glued to their chair and are excluded.
function collectMovingActors() {
  const list = [{ pos: player.position, movable: true }];
  for (const w of workers) list.push({ pos: w.group.position, movable: true });
  for (const c of customers) {
    if (c.state === 'toCounter' || c.state === 'toTable' || c.state === 'walkingOut' || c.state === 'queueing') {
      list.push({ pos: c.group.position, movable: true });
    }
  }
  return list;
}

function resolveCollisions() {
  const actors = collectMovingActors();
  for (let i = 0; i < actors.length; i++) {
    for (let j = i + 1; j < actors.length; j++) {
      const a = actors[i], b = actors[j];
      const dx = b.pos.x - a.pos.x;
      const dz = b.pos.z - a.pos.z;
      const distSq = dx * dx + dz * dz;
      const minDist = COLLIDE_RADIUS * 2;
      if (distSq > 0.0001 && distSq < minDist * minDist) {
        const dist = Math.sqrt(distSq);
        const overlap = (minDist - dist) * 0.5;
        const nx = dx / dist, nz = dz / dist;
        a.pos.x -= nx * overlap; a.pos.z -= nz * overlap;
        b.pos.x += nx * overlap; b.pos.z += nz * overlap;
        // Keep everyone inside the dining-room bounds after being pushed.
        a.pos.x = THREE.MathUtils.clamp(a.pos.x, -FLOOR_HALF_X + 0.5, FLOOR_HALF_X - 0.5);
        b.pos.x = THREE.MathUtils.clamp(b.pos.x, -FLOOR_HALF_X + 0.5, FLOOR_HALF_X - 0.5);
        a.pos.z = THREE.MathUtils.clamp(a.pos.z, FLOOR_MIN_Z + 0.5, FLOOR_MAX_Z + 0.3);
        b.pos.z = THREE.MathUtils.clamp(b.pos.z, FLOOR_MIN_Z + 0.5, FLOOR_MAX_Z + 0.3);
      }
    }
  }
}

function updateCashPickups(delta) {
  for (let i = cashPickups.length - 1; i >= 0; i--) {
    const p = cashPickups[i];
    if (player.position.distanceTo(p.group.position) < 1.25) {
      state.cash += p.value;
      scene.remove(p.group);
      cashPickups.splice(i, 1);
    }
  }
}

function unlockTable(index) {
  const table = tables[index];
  if (!table || table.unlocked) return;
  table.unlocked = true; table.mesh.visible = true; table.mesh.scale.setScalar(1);
  showToast('Table Bought! 🍽️');
  refreshTablePads();
}

function unlockWorkerBuy() {
  hireWorker();
  showToast('Worker Hired! 👨‍🍳');
  const idx = unlockZones.indexOf(workerPad);
  if (idx >= 0) unlockZones.splice(idx, 1);
  if (workerPad) scene.remove(workerPad.group);
  spawnWorkerPad();
}

function unlockSpeed() {
  state.speedLevel++;
  state.playerSpeed += SPEED_STEP;
  showToast(`Speed Up! 🏃`);
  const idx = unlockZones.indexOf(speedPad);
  if (idx >= 0) unlockZones.splice(idx, 1);
  if (speedPad) scene.remove(speedPad.group);
  spawnSpeedPad();
}

function unlockGrillSpeed() {
  state.grillLevel++;
  state.grillCookTime = Math.max(0.14, state.grillCookTime - GRILL_STEP);
  showToast(`Grill Upgraded! 🔥`);
  const idx = unlockZones.indexOf(grillPad);
  if (idx >= 0) unlockZones.splice(idx, 1);
  if (grillPad) scene.remove(grillPad.group);
  spawnGrillPad();
}

function updateUnlockZones(delta) {
  for (const zone of unlockZones) {
    if (zone.done || zone.locked) continue;
    if (player.position.distanceTo(zone.position) < zone.radius && state.cash > 0) {
      const drain = Math.min(90 * delta, state.cash, zone.cost - zone.progress);
      state.cash -= drain; zone.progress += drain;
      const frac = zone.progress / zone.cost;
      zone.fill.scale.set(frac, frac, frac);
      if (zone.progress >= zone.cost - 0.001) {
        zone.done = true; scene.remove(zone.group);
        if (zone.type === 'table') unlockTable(zone.tableIndex);
        if (zone.type === 'worker') unlockWorkerBuy();
        if (zone.type === 'speed') unlockSpeed();
        if (zone.type === 'grillSpeed') unlockGrillSpeed();
      }
    }
  }
  for (let i = unlockZones.length - 1; i >= 0; i--) if (unlockZones[i].done) unlockZones.splice(i, 1);
}

/* ---------- Level: unlocks next buyable slot (doesn't give free tables) ----- */
function getLevelProgress() {
  const th = state.levelThresholds;
  const prev = state.level <= 1 ? 0 : th[state.level - 2];
  const next = th[state.level - 1] || (prev + 40);
  const cur = state.servedTotal;
  return {
    level: state.level,
    cur: Math.max(0, cur - prev),
    need: next - prev,
    frac: Math.min(1, Math.max(0, (cur - prev) / (next - prev))),
  };
}

function applyLevelReward(newLevel) {
  // Level only opens the next purchase (unlocks locked pad) + small cash tip
  refreshTablePads();
  if (workerPad && workerPad.locked && newLevel >= 2) setPadLocked(workerPad, false);
  const bonus = 10 + newLevel * 3;
  state.cash += bonus;
  showToast(`Lv.${newLevel}! 🔓 +$${bonus}`);
}

function checkLevelUp() {
  const th = state.levelThresholds;
  let leveled = false;
  while (state.level - 1 < th.length && state.servedTotal >= th[state.level - 1]) {
    state.level++;
    applyLevelReward(state.level);
    leveled = true;
  }
  if (state.level - 1 >= th.length) {
    const last = th[th.length - 1];
    const extra = state.servedTotal - last;
    const extraLevels = Math.floor(extra / 40);
    const targetLevel = th.length + 1 + extraLevels;
    while (state.level < targetLevel) {
      state.level++;
      applyLevelReward(state.level);
      leveled = true;
    }
  }
  if (leveled) updateLevelUI();
}

function updateLevelUI() {
  const p = getLevelProgress();
  const badge = document.getElementById('levelBadge');
  const label = document.getElementById('levelXpLabel');
  const fill = document.getElementById('levelXpFill');
  if (badge) badge.textContent = `Lv.${p.level}`;
  if (label) label.textContent = `${p.cur} / ${p.need}`;
  if (fill) fill.style.width = `${(p.frac * 100).toFixed(1)}%`;
}
updateLevelUI();

function onResize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  setCameraFrustum();
}
window.addEventListener('resize', onResize);
onResize();

/* ------------------------------------ Main Loop ----------------------------------------- */
let gameStarted = false;

function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(state.clock.getDelta(), 0.05);
  if (!gameStarted) { renderer.render(scene, camera); return; }

  allMixers.forEach(m => m.update(delta));

  updatePlayerAndCamera(delta);
  updatePlayerGrill(delta);
  updatePlayerDeposit(delta);
  updateCustomers(delta);
  updateWorkers(delta);
  resolveCollisions();       // keep player/staff/guests from overlapping
  animateStackPops(delta);   // smooth pop-in for newly stacked burgers
  updateCashPickups(delta);
  updateUnlockZones(delta);

  state.spawnTimer += delta;
  if (state.spawnTimer >= state.spawnInterval) { state.spawnTimer = 0; spawnCustomer(); }

  const cashDisplay = Math.floor(state.cash);
  const cashValEl = document.getElementById('cashVal');
  if (cashValEl.textContent !== String(cashDisplay)) {
    cashValEl.textContent = cashDisplay;
    const bar = document.getElementById('cashBar');
    bar.classList.remove('bump'); void bar.offsetWidth; bar.classList.add('bump');
  }
  updateLevelUI();
  renderer.render(scene, camera);
}
animate();

/* ------------------------------------ Model loading & game start ------------------------ */
// Fix for "THREE.GLTFLoader: Couldn't load texture blob-request://…":
// this sandbox's webview can't reliably fetch blob: URLs that GLTFLoader
// creates internally for the model's embedded texture image. We never use
// that texture anyway — createHumanoid() replaces every material with a
// solid-color MeshBasicMaterial — so a custom LoadingManager intercepts any
// blob: image request and swaps in a tiny inline transparent pixel instead
// of letting it hit the network path that was failing.
const TRANSPARENT_PIXEL =
  'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=';
const gltfManager = new THREE.LoadingManager();
gltfManager.setURLModifier((url) => (url.startsWith('blob:') ? TRANSPARENT_PIXEL : url));
const loader = new GLTFLoader(gltfManager);

function startGame(gltf) {
  stickmanTemplate = gltf.scene;
  stickmanClips = gltf.animations;

  player = createHumanoid({ tint: 0xffeaa7, role: 'player' });
  player.position.set(0, 0, 1.5);
  scene.add(player);
  trayGroup.position.set(0.65, HUMANOID_HEIGHT * 0.55, 0.15);
  player.add(trayGroup);

  camera.position.copy(player.position.clone().add(CAM_OFFSET));
  camera.lookAt(player.position.x, 0.5, player.position.z);

  gameStarted = true;
  document.getElementById('loadingOverlay').classList.add('hidden');
}

function showLoadError(err) {
  console.error('Failed to load stickman model', err);
  const msg = (err && err.message) ? err.message : String(err);
  document.getElementById('loadingText').textContent = 'Load error: ' + msg.substring(0, 80);
}

// Parse the decoded bytes directly — no object-URL round trip for the main
// file, so nothing here depends on blob: fetch support at all. The texture
// interception above still covers the model's embedded image reference.
try {
  const bytes = base64ToArrayBuffer(STICKMAN_GLB_BASE64);
  loader.parse(bytes, '', startGame, showLoadError);
} catch (e) {
  showLoadError(e);
}
